services:
  postgres:
    image: postgres:16-alpine
    container_name: gestcom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gestcom}
      POSTGRES_USER: ${DB_USER:-gestcom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestcom}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - gestcom-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gestcom} -d ${DB_NAME:-gestcom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestcom-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3255:3255"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 3255
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gestcom}
      DB_USER: ${DB_USER:-gestcom}
      DB_PASSWORD: ${DB_PASSWORD:-gestcom}
      JWT_SECRET: ${JWT_SECRET:-gestcom-super-secret-jwt-key-change-me-2026-min-32-chars}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-720}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://10.10.10.25:2534,http://localhost:2534}
      GESTCOM_ADMIN_USERNAME: ${GESTCOM_ADMIN_USERNAME:-admin}
      GESTCOM_ADMIN_PASSWORD: ${GESTCOM_ADMIN_PASSWORD:-admin123}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://10.10.10.25:3255}
    container_name: gestcom-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "2534:2534"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://10.10.10.25:3255}

volumes:
  gestcom-pgdata: