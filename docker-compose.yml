services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestcom-backend
    restart: unless-stopped
    ports:
      - "6228:6228"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 6228
      DB_HOST: 10.10.10.50
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gestcom}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://10.10.10.50:5432/${DB_NAME:-gestcom}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-gestcom-super-secret-jwt-key-change-me-2026-min-32-chars}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-720}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://10.10.10.25:2534,http://localhost:2534}
      GESTCOM_ADMIN_USERNAME: ${GESTCOM_ADMIN_USERNAME:-admin}
      GESTCOM_ADMIN_PASSWORD: ${GESTCOM_ADMIN_PASSWORD:-admin123}
      GESTCOM_DEFAULT_PASSWORD: ${GESTCOM_DEFAULT_PASSWORD:-demo1234}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://10.10.10.25:6228}
    container_name: gestcom-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "2534:2534"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://10.10.10.25:6228}