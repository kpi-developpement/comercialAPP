spring:
  application:
    name: gestcom
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestcom}
    username: ${DB_USER:gestcom}
    password: ${DB_PASSWORD:gestcom}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB

server:
  port: ${SERVER_PORT:3255}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

gestcom:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:2534}
  admin:
    username: ${GESTCOM_ADMIN_USERNAME:admin}
    password: ${GESTCOM_ADMIN_PASSWORD:}
